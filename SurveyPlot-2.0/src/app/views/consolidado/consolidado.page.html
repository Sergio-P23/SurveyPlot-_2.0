<ion-header translucent class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/home"
        text="Volver al Inicio"
        style="color: rgb(200, 205, 210)"
      ></ion-back-button>
    </ion-buttons>
    <ion-title
      slot="end"
      style="
        color: rgb(200, 205, 210);
        font-size: 0.85rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      "
    >
      CONSOLIDADO
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="vista-wrapper">
    <div class="vista-panel animate__animated animate__fadeIn">
      <!-- FORMULARIO -->
      <div *ngIf="mostrarFormulario">
        <div class="form-icon-box">
          <ion-icon
            name="layers-outline"
            class="form-icon consolidado"
          ></ion-icon>
        </div>

        <h2 class="form-title">Cargar Archivos Excel</h2>

        <div class="form-dos-columnas">
          <!-- Columna 1 -->
          <div class="form-columna">
            <h3 class="columna-titulo">Encuesta 1</h3>
            <div class="form-group">
              <label class="form-label">Nombre de la Encuesta</label>
              <input
                class="form-input"
                type="text"
                placeholder="C31 - Estudiantes c. deportes"
                [(ngModel)]="nombreEncuesta1"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Selecciona un archivo Excel</label>
              <div class="file-input-wrapper">
                <span class="file-placeholder">{{ nombreArchivo1 }}</span>
                <button class="btn-file consolidado">
                  <ion-icon name="cloud-upload-outline"></ion-icon>
                  Elegir archivo
                </button>
                <input
                  type="file"
                  accept=".xlsx,.xls"
                  class="file-hidden"
                  (change)="onArchivo1Seleccionado($event)"
                />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label"
                >Columna primera pregunta (Ej: A, B, C...)</label
              >
              <input
                class="form-input"
                type="text"
                placeholder="Ej: E"
                maxlength="1"
                [(ngModel)]="columnaInicio1"
              />
            </div>
            <div class="form-group">
              <label class="form-label"
                >Columna última pregunta (Ej: D, E, F...)</label
              >
              <input
                class="form-input"
                type="text"
                placeholder="Ej: M"
                maxlength="1"
                [(ngModel)]="columnaFin1"
              />
            </div>
            <div class="form-group">
              <label class="form-label"
                >Fila donde inician las respuestas</label
              >
              <input
                class="form-input"
                type="text"
                placeholder="Ej: 2"
                [(ngModel)]="filaInicio1"
              />
            </div>
            <div class="form-group">
              <label class="form-label"
                >Fila donde terminan las respuestas</label
              >
              <input
                class="form-input"
                type="text"
                placeholder="Ej: 42"
                [(ngModel)]="filaFin1"
              />
            </div>
          </div>

          <!-- Columna 2 -->
          <div class="form-columna">
            <h3 class="columna-titulo">Encuesta 2</h3>
            <div class="form-group">
              <label class="form-label">Nombre de la Encuesta</label>
              <input
                class="form-input"
                type="text"
                placeholder="C31 - Docentes c. deportes"
                [(ngModel)]="nombreEncuesta2"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Selecciona un archivo Excel</label>
              <div class="file-input-wrapper">
                <span class="file-placeholder">{{ nombreArchivo2 }}</span>
                <button class="btn-file consolidado">
                  <ion-icon name="cloud-upload-outline"></ion-icon>
                  Elegir archivo
                </button>
                <input
                  type="file"
                  accept=".xlsx,.xls"
                  class="file-hidden"
                  (change)="onArchivo2Seleccionado($event)"
                />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label"
                >Columna primera pregunta (Ej: A, B, C...)</label
              >
              <input
                class="form-input"
                type="text"
                placeholder="Ej: E"
                maxlength="1"
                [(ngModel)]="columnaInicio2"
              />
            </div>
            <div class="form-group">
              <label class="form-label"
                >Columna última pregunta (Ej: D, E, F...)</label
              >
              <input
                class="form-input"
                type="text"
                placeholder="Ej: M"
                maxlength="1"
                [(ngModel)]="columnaFin2"
              />
            </div>
            <div class="form-group">
              <label class="form-label"
                >Fila donde inician las respuestas</label
              >
              <input
                class="form-input"
                type="text"
                placeholder="Ej: 2"
                [(ngModel)]="filaInicio2"
              />
            </div>
            <div class="form-group">
              <label class="form-label"
                >Fila donde terminan las respuestas</label
              >
              <input
                class="form-input"
                type="text"
                placeholder="Ej: 42"
                [(ngModel)]="filaFin2"
              />
            </div>
          </div>
        </div>

        <br /><br />
        <button class="btn-generar consolidado" (click)="generarGraficas()">
          Generar gráficas
        </button>
      </div>

      <!-- GRÁFICAS -->
      <div *ngIf="mostrarGraficas">
        <div id="graficas-consolidado" class="graficas-grid"></div>
        <div class="graficas-botones">
          <button class="btn-generar consolidado" (click)="descargarPDF()">
            Descargar PDF
          </button>
          <button class="btn-generar secundario" (click)="regresarMenu()">
            Regresar
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-text">
    <p>© 2026 SurveyPlot Platform. Todos los derechos reservados.</p>
  </footer>
</ion-content>
